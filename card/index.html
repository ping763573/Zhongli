  <title>程序員無名 | 個人電子名片</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --bg-2: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, .08);
      --accent: #0071e3;
      --accent-2: #65b8ff;
      --panel: rgba(255, 255, 255, .72);
      --panel-strong: rgba(255, 255, 255, .92);
      --shadow: 0 28px 80px rgba(0, 0, 0, .13);
      --avatar-glow: rgba(0, 113, 227, .2);
      --chip: rgba(0, 113, 227, .09);
      --chip-text: #0759a8;
      --ring: rgba(0, 113, 227, .28);
    }

    html[data-theme="cinema"] {
      color-scheme: dark;
      --bg: #09090b;
      --bg-2: #15151a;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, .12);
      --accent: #f5c16c;
      --accent-2: #8a7cff;
      --panel: rgba(24, 24, 29, .72);
      --panel-strong: rgba(30, 30, 36, .92);
      --shadow: 0 28px 90px rgba(0, 0, 0, .46);
      --avatar-glow: rgba(245, 193, 108, .22);
      --chip: rgba(245, 193, 108, .13);
      --chip-text: #ffdc9c;
      --ring: rgba(245, 193, 108, .35);
    }

    html[data-theme="neon"] {
      color-scheme: dark;
      --bg: #030711;
      --bg-2: #07121c;
      --text: #f7fbff;
      --muted: #9eb3c7;
      --line: rgba(125, 255, 234, .16);
      --accent: #25f4d0;
      --accent-2: #58a6ff;
      --panel: rgba(8, 20, 31, .76);
      --panel-strong: rgba(10, 28, 43, .94);
      --shadow: 0 28px 90px rgba(0, 244, 208, .14);
      --avatar-glow: rgba(37, 244, 208, .26);
      --chip: rgba(37, 244, 208, .12);
      --chip-text: #8ffff0;
      --ring: rgba(37, 244, 208, .34);
    }

    html[data-theme="warm"] {
      color-scheme: light;
      --bg: #f7f3ee;
      --bg-2: #fffaf3;
      --text: #221b16;
      --muted: #766b61;
      --line: rgba(86, 55, 27, .12);
      --accent: #c35f35;
      --accent-2: #e8a24d;
      --panel: rgba(255, 250, 243, .75);
      --panel-strong: rgba(255, 252, 247, .94);
      --shadow: 0 28px 80px rgba(121, 71, 37, .18);
      --avatar-glow: rgba(195, 95, 53, .18);
      --chip: rgba(195, 95, 53, .1);
      --chip-text: #8f3f22;
      --ring: rgba(195, 95, 53, .28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--accent) 24%, transparent), transparent 30rem),
        radial-gradient(circle at bottom right, color-mix(in srgb, var(--accent-2) 22%, transparent), transparent 28rem),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
      transition: background .35s ease, color .25s ease;
      overflow-x: hidden;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-items: center;
      padding: 28px 0;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(280px, .92fr) minmax(360px, 1.08fr);
      gap: 18px;
      align-items: stretch;
      min-width: 0;
    }

    .identity,
    .details {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      min-width: 0;
    }

    .identity {
      min-height: 620px;
      border-radius: 34px 10px 10px 34px;
      padding: 42px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    .identity::after {
      content: "";
      position: absolute;
      inset: auto -18% -22% 22%;
      height: 260px;
      border-radius: 999px;
      background: radial-gradient(circle, var(--avatar-glow), transparent 70%);
      pointer-events: none;
    }

    .avatar-wrap {
      width: min(100%, 350px);
      aspect-ratio: 1;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 38px;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--panel-strong) 84%, var(--accent)), var(--panel)),
        radial-gradient(circle, var(--avatar-glow), transparent 60%);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .34), 0 24px 64px var(--avatar-glow);
      overflow: hidden;
    }

    .avatar {
      width: 92%;
      height: 92%;
      display: block;
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .16));
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.65rem, 6vw, 5.2rem);
      line-height: .98;
      letter-spacing: 0;
      max-width: 7em;
    }

    .role {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(1.08rem, 2.4vw, 1.35rem);
      line-height: 1.55;
      font-weight: 600;
    }

    .details {
      border-radius: 10px 34px 34px 10px;
      padding: 34px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-strong);
      color: var(--muted);
      font-size: .88rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
    }

    .theme-switcher {
      display: grid;
      grid-template-columns: repeat(4, 34px);
      gap: 8px;
      padding: 7px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
    }

    .theme-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      background: var(--swatch);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .46);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .theme-btn:hover {
      transform: translateY(-1px);
    }

    .theme-btn[aria-pressed="true"] {
      box-shadow: 0 0 0 3px var(--ring), inset 0 0 0 1px rgba(255, 255, 255, .66);
    }

    .theme-btn:focus-visible,
    .action:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 3px;
    }

    .studio-swatch {
      --swatch: linear-gradient(135deg, #ffffff 0 45%, #0071e3 45% 100%);
    }

    .cinema-swatch {
      --swatch: linear-gradient(135deg, #09090b 0 48%, #f5c16c 48% 100%);
    }

    .neon-swatch {
      --swatch: linear-gradient(135deg, #030711 0 48%, #25f4d0 48% 100%);
    }

    .warm-swatch {
      --swatch: linear-gradient(135deg, #fffaf3 0 48%, #c35f35 48% 100%);
    }

    .intro {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      padding: 20px 0 4px;
    }

    .quote {
      margin: 0;
      font-size: clamp(1.6rem, 3.4vw, 3.35rem);
      line-height: 1.08;
      font-weight: 760;
      letter-spacing: 0;
      max-width: 10.5em;
    }

    .bio {
      margin: 0;
      max-width: 44rem;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.16rem);
      line-height: 1.86;
      font-weight: 520;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-width: 0;
    }

    .action {
      max-width: 100%;
      min-width: 0;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: var(--panel-strong);
      text-decoration: none;
      font: inherit;
      font-size: .96rem;
      font-weight: 720;
      text-align: center;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .action:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 52%, var(--line));
    }

    .action.primary {
      color: #fff;
      border-color: color-mix(in srgb, var(--accent) 84%, #fff);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .skills {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .skill {
      min-height: 76px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--chip);
      color: var(--chip-text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
    }

    .skill strong {
      color: var(--text);
      font-size: .98rem;
    }

    .skill span {
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.4;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 5;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: var(--text);
      box-shadow: var(--shadow);
      transition: opacity .2s ease, transform .2s ease;
      font-size: .92rem;
      font-weight: 680;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 860px) {
      .page {
        width: min(100% - 28px, 620px);
        align-items: start;
        padding: 14px 0;
      }

      .shell {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .identity,
      .details {
        border-radius: 26px;
      }

      .identity {
        min-height: auto;
        padding: 28px;
      }

      .avatar-wrap {
        width: min(82vw, 300px);
        margin-bottom: 22px;
        border-radius: 30px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .details {
        padding: 24px;
      }

      .intro {
        padding-top: 0;
      }

      .quote {
        max-width: 11em;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .action {
        width: 100%;
        white-space: normal;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 20px, 460px);
      }

      .identity,
      .details {
        padding: 20px;
        border-radius: 22px;
      }

      .theme-switcher {
        grid-template-columns: repeat(4, 32px);
      }

      .theme-btn {
        width: 32px;
        height: 32px;
      }

      .skills {
        grid-template-columns: 1fr;
      }

      .action {
        padding-inline: 12px;
        font-size: .92rem;
      }

      h1 {
        font-size: clamp(2.35rem, 15vw, 3.45rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite">已複製 Line ID</div>

  <script>
    const root = document.documentElement;
    const themeButtons = Array.from(document.querySelectorAll("[data-theme-choice]"));
    const copyButton = document.getElementById("copyLine");
    const toast = document.getElementById("toast");
    const themes = new Set(["studio", "cinema", "neon", "warm"]);

    function applyTheme(theme) {
      const safeTheme = themes.has(theme) ? theme : "studio";
      root.dataset.theme = safeTheme;
      themeButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.themeChoice === safeTheme));
      });
      localStorage.setItem("business-card-theme", safeTheme);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    themeButtons.forEach((button) => {
      button.addEventListener("click", () => applyTheme(button.dataset.themeChoice));
    });

    copyButton.addEventListener("click", async () => {
      const value = copyButton.dataset.copyValue;
      try {
        await navigator.clipboard.writeText(value);
        showToast("已複製 Line ID：1234567");
      } catch (error) {
        showToast("Line ID：1234567");
      }
    });

    applyTheme(localStorage.getItem("business-card-theme") || "studio");
  </script>
</body>
</html>
