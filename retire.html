<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精準退休規劃 - 介面優化版</title>
    <!-- React Core -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; background-color: #f0f2f5; }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            transition: background .15s ease-in-out;
        }
        input[type="range"]::-webkit-slider-thumb:hover { background: #2563eb; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .inflation-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #fee2e2;
            color: #b91c1c;
            font-weight: bold;
            display: inline-block;
        }

        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #3b82f6;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #3b82f6;
        }

        .stale-data {
            opacity: 0.6;
            filter: grayscale(0.5);
            transition: all 0.3s;
        }
        
        /* Table Styling */
        .cashflow-table th { background-color: #f8fafc; color: #64748b; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0; }
        .cashflow-table td { padding: 0.75rem 1rem; font-size: 0.875rem; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .cashflow-table tr:last-child td { border-bottom: none; }
        .cashflow-table tr:hover td { background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Constants ---
        const INITIAL_PARAMS = {
            currentAge: 40,
            retireAge: 65,
            lifeExpectancy: 85,
            inflationRate: 3,
            postRetireRoiRate: 5,
            laborPensionLumpSum: 0,
            laborInsuranceMonthly: 0,
            preRetireRoiRate: 6,
            currentMonthlyInvestment: 0,
            hasMedicalInsurance: false,
            hasLTCInsurance: false,
        };

        const INITIAL_ITEMS = [
            { id: 1, name: '退休生活費', type: 'flow', currentAmount: 30000, annualMonths: 12, color: '#3b82f6' },
            { id: 2, name: '退休娛樂費', type: 'flow', currentAmount: 10000, annualMonths: 12, color: '#10b981' },
            { id: 3, name: '老年醫療預備金', type: 'stock', currentAmount: 2500000, color: '#f59e0b', isInsuranceItem: 'medical' },
            { id: 4, name: '長照預備金', type: 'stock', currentAmount: 4000000, color: '#ef4444', isInsuranceItem: 'ltc' },
        ];

        // --- Icons ---
        const IconMoney = () => <i className="fas fa-coins text-yellow-500"></i>;
        const IconShield = () => <i className="fas fa-shield-alt text-emerald-500"></i>;
        const IconInvest = () => <i className="fas fa-chart-line text-blue-500"></i>;
        const IconUser = () => <i className="fas fa-user-clock text-indigo-500"></i>;
        const IconPlus = () => <i className="fas fa-plus text-white"></i>;
        const IconCalc = () => <i className="fas fa-calculator"></i>;
        const IconReset = () => <i className="fas fa-undo-alt"></i>;
        const IconDownload = () => <i className="fas fa-download"></i>;
        const IconTable = () => <i className="fas fa-table"></i>;

        // --- Formatters ---
        const formatCurrency = (num) => {
            if (num === undefined || num === null || isNaN(num)) return "$0";
            return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(num);
        };

        const formatNumber = (num) => {
            if (num === undefined || num === null || isNaN(num)) return "0";
             return new Intl.NumberFormat('zh-TW').format(num);
        };

        const Toggle = ({ label, checked, onChange }) => (
            <div className="flex items-center justify-between mb-2">
                <span className="text-sm text-slate-600 font-medium">{label}</span>
                <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id={label} checked={checked} onChange={(e) => onChange(e.target.checked)} 
                           className="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 ease-in-out"
                           style={{ right: checked ? '0' : 'auto', left: checked ? 'auto' : '0', borderColor: checked ? '#3b82f6' : '#e5e7eb' }}/>
                    <label htmlFor={label} className={`toggle-label block overflow-hidden h-5 rounded-full cursor-pointer ${checked ? 'bg-blue-500' : 'bg-gray-300'}`}></label>
                </div>
            </div>
        );

        // --- Chart Component ---
        const CashFlowChart = ({ chartData, retireAge, lifeExpectancy }) => {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);

            const downloadChart = () => {
                if (chartInstanceRef.current) {
                    const link = document.createElement('a');
                    link.download = `退休資產模擬圖_${retireAge}至${lifeExpectancy}歲.png`;
                    link.href = chartInstanceRef.current.toBase64Image();
                    link.click();
                }
            };

            useEffect(() => {
                if (!canvasRef.current || !chartData) return;

                const ctx = canvasRef.current.getContext('2d');
                if (chartInstanceRef.current) chartInstanceRef.current.destroy();

                chartInstanceRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: chartData.labels,
                        datasets: [
                            {
                                label: '理想資產曲線 (無缺口)',
                                data: chartData.ideal,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 3,
                                pointRadius: 0,
                                fill: false,
                                tension: 0.4
                            },
                            {
                                label: '目前資產預估 (含退休金/投資)',
                                data: chartData.actual,
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                borderWidth: 3,
                                pointRadius: 2,
                                fill: true,
                                tension: 0.4
                            },
                            {
                                label: '歸零線',
                                data: Array(chartData.labels.length).fill(0),
                                borderColor: '#ef4444',
                                borderWidth: 1,
                                borderDash: [5, 5],
                                pointRadius: 0,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: (context) => (context.dataset.label || '') + ': ' + new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(context.parsed.y)
                                }
                            },
                            legend: { position: 'bottom' },
                            title: { display: true, text: '退休後資產消耗模擬', font: { size: 16 } }
                        },
                        scales: {
                            y: { ticks: { callback: (value) => (value / 10000).toFixed(0) + '萬' }, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false } }
                        }
                    }
                });

                return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
            }, [chartData]);

            return (
                <div className="relative w-full h-80 md:h-96 bg-white p-2 rounded-xl">
                     <button onClick={downloadChart} className="absolute top-0 right-0 m-2 z-10 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-1.5 rounded-full flex items-center gap-2 transition shadow-sm">
                        <IconDownload /> 下載圖表 (PNG)
                    </button>
                    <canvas ref={canvasRef}></canvas>
                </div>
            );
        };

        const App = () => {
            const [params, setParams] = useState(INITIAL_PARAMS);
            const [items, setItems] = useState(INITIAL_ITEMS);
            const [result, setResult] = useState(null);
            const [isDirty, setIsDirty] = useState(false);

            // --- Core Calculation Logic ---
            const calculateData = (currentParams, currentItems) => {
                // 1. Time Params
                const yearsToRetire = Math.max(0, currentParams.retireAge - currentParams.currentAge);
                const monthsToRetire = yearsToRetire * 12;
                const yearsInRetirement = Math.max(0, currentParams.lifeExpectancy - currentParams.retireAge);
                
                // 2. Rate Params
                const inflationRate = currentParams.inflationRate / 100;
                const roiRate = currentParams.postRetireRoiRate / 100;
                const preRoiRate = currentParams.preRetireRoiRate / 100;
                
                // Calculate Inflation Multiplier to Retirement Date
                const inflationMultiplier = Math.pow(1 + inflationRate, yearsToRetire);

                // 3. Prepare Retirement Assets (Start of Retirement)
                let investmentFV = 0;
                if (currentParams.currentMonthlyInvestment > 0 && yearsToRetire > 0) {
                    const monthlyRate = preRoiRate / 12;
                    investmentFV = currentParams.currentMonthlyInvestment * ((Math.pow(1 + monthlyRate, monthsToRetire) - 1) / monthlyRate);
                }
                const startAssets = currentParams.laborPensionLumpSum + investmentFV;

                // 4. NPV Calculation (Gap at Age 65)
                let npvExpenses = 0;
                let npvIncome = 0;
                let stockExpensesAt65 = 0;
                let baseFlowExpenseAt65 = 0;

                const detailedItems = currentItems.map(item => {
                    if ((item.isInsuranceItem === 'medical' && currentParams.hasMedicalInsurance) ||
                        (item.isInsuranceItem === 'ltc' && currentParams.hasLTCInsurance)) {
                        return { ...item, futureValue: 0, requiredCapital: 0, covered: true };
                    }

                    let futureValueAtRetirement = 0;
                    if (item.type === 'stock') {
                        futureValueAtRetirement = item.currentAmount * inflationMultiplier;
                        stockExpensesAt65 += futureValueAtRetirement;
                    } else {
                        const annualAmount = item.currentAmount * item.annualMonths;
                        futureValueAtRetirement = annualAmount * inflationMultiplier;
                        baseFlowExpenseAt65 += futureValueAtRetirement;
                    }
                    return { ...item, futureValue: futureValueAtRetirement, requiredCapital: 0, covered: false }; 
                });

                const laborInsuranceAnnual = currentParams.laborInsuranceMonthly * 12;

                // NPV Loop
                for (let i = 1; i <= yearsInRetirement; i++) {
                    const discountFactor = Math.pow(1 + roiRate, i);
                    const expenseThisYear = baseFlowExpenseAt65 * Math.pow(1 + inflationRate, i - 1);
                    npvExpenses += expenseThisYear / discountFactor;
                    npvIncome += laborInsuranceAnnual / discountFactor;
                }
                npvExpenses += stockExpensesAt65;

                // Final Shortfall Calculation (Present Value at Age 65)
                const totalPVNeeded = npvExpenses;
                const totalPVHave = npvIncome + startAssets;
                const finalShortfall = totalPVNeeded - totalPVHave;

                const shortfallFV = finalShortfall * Math.pow(1 + roiRate, yearsInRetirement);

                // Distribute Capital Needs for Table
                const totalFlowPV = npvExpenses - stockExpensesAt65;
                detailedItems.forEach(item => {
                    if (!item.covered) {
                        if (item.type === 'stock') {
                            item.requiredCapital = item.futureValue;
                        } else {
                            if (baseFlowExpenseAt65 > 0) {
                                const ratio = item.futureValue / baseFlowExpenseAt65;
                                item.requiredCapital = totalFlowPV * ratio;
                            }
                        }
                    }
                });
                
                const govDeductions = currentParams.laborPensionLumpSum + npvIncome;
                const grossNeed = npvExpenses;

                // --- 6. Timeline & Chart Simulation ---
                const timelineData = [];
                const labels = [];
                const dataIdeal = [];
                const dataActual = [];
                
                let simBalanceIdeal = startAssets + (finalShortfall > 0 ? finalShortfall : 0);
                let simBalanceActual = startAssets;
                let accumBalance = 0;
                
                // Accumulation Phase
                for (let age = currentParams.currentAge; age < currentParams.retireAge; age++) {
                    const monthlyRate = preRoiRate / 12;
                    const yearlyContribFV = currentParams.currentMonthlyInvestment * ((Math.pow(1 + monthlyRate, 12) - 1) / monthlyRate);
                    accumBalance = accumBalance * (1 + preRoiRate) + yearlyContribFV;
                    timelineData.push({ age, type: '累積期', assets: accumBalance, needs: 0, gap: accumBalance });
                }

                // Retirement Phase
                simBalanceIdeal -= stockExpensesAt65;
                simBalanceActual -= stockExpensesAt65;
                let currentFlowExpense = baseFlowExpenseAt65;

                for (let i = 0; i <= yearsInRetirement; i++) {
                    const age = currentParams.retireAge + i;
                    
                    if (i <= yearsInRetirement) {
                        labels.push(`${age}歲`);
                        dataIdeal.push(simBalanceIdeal);
                        dataActual.push(simBalanceActual);
                    }
                    
                    if (i < yearsInRetirement) {
                        const growthIdeal = simBalanceIdeal * roiRate;
                        const growthActual = simBalanceActual * roiRate;
                        const netFlow = laborInsuranceAnnual - currentFlowExpense; 
                        
                        simBalanceIdeal = simBalanceIdeal + growthIdeal + netFlow;
                        simBalanceActual = simBalanceActual + growthActual + netFlow;
                        
                        timelineData.push({ age, type: '退休期', assets: simBalanceActual, needs: currentFlowExpense, gap: simBalanceActual });
                        currentFlowExpense = currentFlowExpense * (1 + inflationRate);
                    } else {
                         timelineData.push({ age, type: '壽命終點', assets: simBalanceActual, needs: 0, gap: simBalanceActual });
                    }
                }

                // 7. PMT Suggestion
                let suggestedMonthlySave = 0;
                if (finalShortfall > 0 && yearsToRetire > 0) {
                    const monthlyRate = preRoiRate / 12;
                    suggestedMonthlySave = finalShortfall * monthlyRate / (Math.pow(1 + monthlyRate, monthsToRetire) - 1);
                }
                
                // Calculate Total Monthly Investment Needed
                let totalMonthlySave = currentParams.currentMonthlyInvestment + suggestedMonthlySave;

                return {
                    yearsToRetire,
                    yearsInRetirement,
                    inflationMultiplier,
                    detailedItems,
                    grossNeed,
                    govDeductions,
                    investmentFV,
                    finalShortfall,
                    shortfallFV, 
                    suggestedMonthlySave,
                    totalMonthlySave, // New variable
                    timelineData,
                    chartData: { labels, ideal: dataIdeal, actual: dataActual },
                    timestamp: Date.now()
                };
            };

            useEffect(() => {
                setResult(calculateData(INITIAL_PARAMS, INITIAL_ITEMS));
            }, []);

            useEffect(() => {
                setIsDirty(true);
            }, [params, items]);

            // --- Handlers ---
            const handleCalculate = () => {
                const newResult = calculateData(params, items);
                setResult(newResult);
                setIsDirty(false);
                const resultSection = document.getElementById('results-section');
                if (resultSection && window.innerWidth < 1024) resultSection.scrollIntoView({ behavior: 'smooth' });
            };

            const handleReset = () => {
                if(confirm('確定要清除所有輸入並回復預設值嗎？')) {
                    setParams(INITIAL_PARAMS);
                    setItems(INITIAL_ITEMS);
                    setResult(calculateData(INITIAL_PARAMS, INITIAL_ITEMS));
                    setIsDirty(false);
                }
            };

            const downloadCSV = () => {
                if (!result || !result.timelineData) return;
                const bom = "\uFEFF";
                let csvContent = "data:text/csv;charset=utf-8," + bom;
                csvContent += "年齡,階段,資產累積金額(預估),退休需求金額(通膨後),資產結餘\n";
                result.timelineData.forEach(row => {
                    const rowStr = `${row.age},${row.type},${Math.round(row.assets)},${Math.round(row.needs)},${Math.round(row.gap)}`;
                    csvContent += rowStr + "\n";
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "全生涯退休現金流試算.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleParamChange = (e) => setParams(prev => ({ ...prev, [e.target.name]: parseFloat(e.target.value) || 0 }));
            const handleToggleChange = (name, checked) => setParams(prev => ({ ...prev, [name]: checked }));
            const updateItem = (id, field, value) => setItems(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            const addItem = () => {
                const newId = Math.max(...items.map(i => i.id), 0) + 1;
                setItems([...items, { id: newId, name: '新目標', type: 'stock', currentAmount: 100000, annualMonths: 1, color: '#8b5cf6' }]);
            };
            const deleteItem = (id) => setItems(prev => prev.filter(item => item.id !== id));
            const getComputedItem = (itemId) => result ? result.detailedItems.find(i => i.id === itemId) : null;

            if (!result) return <div className="min-h-screen flex items-center justify-center">載入中...</div>;

            return (
                <div className="min-h-screen p-4 md:p-8 pb-20">
                    <div className="max-w-7xl mx-auto">
                        <header className="mb-8 animate-fade-in flex justify-between items-end">
                            <div>
                                <h1 className="text-3xl font-bold text-slate-800 flex items-center gap-3">
                                    <IconMoney /> 精準退休規劃
                                </h1>
                                <p className="text-slate-500 mt-1">全生涯現金流分析與投資建議</p>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            
                            {/* Inputs (Left) */}
                            <div className="lg:col-span-4 space-y-6 flex flex-col">
                                <div className="space-y-6 flex-grow">
                                    {/* 1. Basic Info */}
                                    <div className="glass-card rounded-2xl p-5">
                                        <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><IconUser /> 1. 生涯設定</h3>
                                        <div className="flex gap-2 mb-4">
                                            <div className="flex-1">
                                                <label className="block text-xs text-slate-500 mb-1">現在年齡</label>
                                                <input type="number" name="currentAge" value={params.currentAge} onChange={handleParamChange} className="w-full p-2 border rounded text-center font-bold text-slate-700"/>
                                            </div>
                                            <div className="flex items-center text-gray-300">➜</div>
                                            <div className="flex-1">
                                                <label className="block text-xs text-slate-500 mb-1">退休年齡</label>
                                                <input type="number" name="retireAge" value={params.retireAge} onChange={handleParamChange} className="w-full p-2 border rounded text-center font-bold text-slate-700"/>
                                            </div>
                                            <div className="flex items-center text-gray-300">➜</div>
                                            <div className="flex-1">
                                                <label className="block text-xs text-slate-500 mb-1 text-red-500 font-bold">預期壽命</label>
                                                <input type="number" name="lifeExpectancy" value={params.lifeExpectancy} onChange={handleParamChange} className="w-full p-2 border border-red-200 bg-red-50 rounded text-center font-bold text-red-700"/>
                                            </div>
                                        </div>
                                        <div className="space-y-3 pt-2 border-t border-gray-100">
                                            <div>
                                                <div className="flex justify-between text-xs text-slate-500 mb-1"><span>預估年通膨率 (終身)</span><span className="text-red-500 font-bold">{params.inflationRate}%</span></div>
                                                <input type="range" name="inflationRate" min="0" max="8" step="0.5" value={params.inflationRate} onChange={handleParamChange} />
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-xs text-slate-500 mb-1"><span>退休後投資報酬率</span><span className="text-green-600 font-bold">{params.postRetireRoiRate}%</span></div>
                                                <input type="range" name="postRetireRoiRate" min="1" max="12" step="0.5" value={params.postRetireRoiRate} onChange={handleParamChange} />
                                            </div>
                                        </div>
                                    </div>

                                    {/* 2. Insurance */}
                                    <div className="glass-card rounded-2xl p-5 border-l-4 border-emerald-400">
                                        <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><IconShield /> 2. 風險轉嫁</h3>
                                        <div className="space-y-2">
                                            <Toggle label="已投保足額醫療險" checked={params.hasMedicalInsurance} onChange={(v) => handleToggleChange('hasMedicalInsurance', v)} />
                                            <Toggle label="已投保足額長照險" checked={params.hasLTCInsurance} onChange={(v) => handleToggleChange('hasLTCInsurance', v)} />
                                        </div>
                                    </div>

                                    {/* 3. Investment */}
                                    <div className="glass-card rounded-2xl p-5 border-l-4 border-blue-500">
                                        <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><IconInvest /> 3. 現在投資</h3>
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-sm text-slate-600 mb-1 font-medium">目前每月定期定額</label>
                                                <div className="relative">
                                                    <span className="absolute left-3 top-2 text-gray-400">$</span>
                                                    <input type="number" name="currentMonthlyInvestment" value={params.currentMonthlyInvestment} onChange={handleParamChange}
                                                        className="w-full pl-6 p-2 border border-blue-200 rounded focus:ring-2 focus:ring-blue-300 outline-none font-bold text-blue-700"/>
                                                </div>
                                            </div>
                                            <div>
                                                <div className="flex justify-between mb-1">
                                                    <label className="text-sm text-slate-600">預期年化報酬率 (退休前)</label>
                                                    <span className="text-sm font-bold text-blue-600">{params.preRetireRoiRate}%</span>
                                                </div>
                                                <input type="range" name="preRetireRoiRate" min="1" max="15" step="0.5" value={params.preRetireRoiRate} onChange={handleParamChange} />
                                            </div>
                                        </div>
                                    </div>

                                    {/* 4. Gov Pension */}
                                    <div className="glass-card rounded-2xl p-5">
                                        <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><i className="fas fa-landmark text-purple-500"></i> 4. 政府退休金</h3>
                                        <div className="space-y-3 text-sm">
                                            <div>
                                                <label className="text-slate-500 block mb-1">勞退一次領總額</label>
                                                <input type="number" name="laborPensionLumpSum" value={params.laborPensionLumpSum} onChange={handleParamChange} className="w-full p-2 border rounded outline-none"/>
                                            </div>
                                            <div>
                                                <label className="text-slate-500 block mb-1">勞保年金(月領)</label>
                                                <input type="number" name="laborInsuranceMonthly" value={params.laborInsuranceMonthly} onChange={handleParamChange} className="w-full p-2 border rounded outline-none"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="sticky bottom-4 z-10 mt-6 bg-white/90 backdrop-blur p-4 rounded-2xl shadow-xl border border-slate-200 flex gap-3">
                                    <button onClick={handleReset} className="flex-1 py-3 px-4 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 transition flex items-center justify-center gap-2">
                                        <IconReset /> 重置
                                    </button>
                                    <button onClick={handleCalculate} className={`flex-2 w-full py-3 px-4 rounded-xl font-bold text-white shadow-lg transition flex items-center justify-center gap-2 transform active:scale-95 ${isDirty ? 'bg-blue-600 hover:bg-blue-700 animate-pulse' : 'bg-slate-700 hover:bg-slate-800'}`}>
                                        <IconCalc /> {isDirty ? '更新試算結果' : '重新計算'}
                                    </button>
                                </div>
                            </div>

                            {/* Results (Right) */}
                            <div id="results-section" className={`lg:col-span-8 space-y-6 transition-opacity duration-300 ${isDirty ? 'stale-data' : ''}`}>
                                
                                {/* REORDERED: 1. Input Table (First) */}
                                <div className="glass-card rounded-2xl overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                                        <h3 className="font-semibold text-slate-700">資金需求設定細項</h3>
                                        <button onClick={addItem} className="bg-slate-600 hover:bg-slate-700 text-white px-3 py-1.5 rounded text-sm flex items-center gap-2 transition">
                                            <IconPlus /> 新增
                                        </button>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="text-xs text-slate-500 uppercase bg-slate-100">
                                                <tr>
                                                    <th className="px-4 py-3">項目</th>
                                                    <th className="px-4 py-3 text-right">目前金額 {isDirty && <span className="text-red-500 ml-1">*</span>}</th>
                                                    <th className="px-4 py-3 text-center w-24 text-red-500 font-bold">通膨</th>
                                                    <th className="px-4 py-3 text-right text-slate-600">退休第一年需求</th>
                                                    <th className="px-4 py-3 text-right font-bold text-slate-800">應備本金 (佔比分配)</th>
                                                    <th className="w-8"></th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {items.map((item) => {
                                                    const computed = getComputedItem(item.id);
                                                    const isNewItem = !computed;
                                                    const isCovered = computed ? computed.covered : ((item.isInsuranceItem === 'medical' && params.hasMedicalInsurance) || (item.isInsuranceItem === 'ltc' && params.hasLTCInsurance));

                                                    if (isCovered) return (
                                                        <tr key={item.id} className="bg-emerald-50/50 opacity-60">
                                                            <td className="px-4 py-3 relative"><span className="line-through text-slate-400">{item.name}</span><span className="ml-2 text-[10px] bg-emerald-100 text-emerald-600 px-1 rounded border border-emerald-200">保險已覆蓋</span></td>
                                                            <td className="px-4 py-3 text-right text-slate-400 line-through">{formatNumber(item.currentAmount)}</td>
                                                            <td className="px-4 py-3"></td>
                                                            <td className="px-4 py-3 text-right text-slate-400">-</td>
                                                            <td className="px-4 py-3 text-right font-bold text-emerald-600">0</td>
                                                            <td className="px-4 py-3"></td>
                                                        </tr>
                                                    );

                                                    return (
                                                        <tr key={item.id} className={`hover:bg-slate-50 group transition ${isNewItem ? 'bg-yellow-50' : ''}`}>
                                                            <td className="px-4 py-3">
                                                                <input type="text" value={item.name} onChange={(e) => updateItem(item.id, 'name', e.target.value)} className="w-full bg-transparent border-b border-transparent hover:border-gray-300 focus:border-blue-500 outline-none font-medium" />
                                                                <div className="text-[10px] text-slate-400">{item.type === 'flow' ? '每月持續支出' : '一次性提領'}</div>
                                                            </td>
                                                            <td className="px-4 py-3 text-right">
                                                                <div className="flex items-center justify-end gap-1">
                                                                    <span className="text-gray-400 text-xs">$</span>
                                                                    <input type="number" value={item.currentAmount} onChange={(e) => updateItem(item.id, 'currentAmount', parseFloat(e.target.value) || 0)} className="w-24 text-right bg-transparent border-b border-dashed border-gray-300 focus:border-blue-500 outline-none" />
                                                                </div>
                                                            </td>
                                                            {isNewItem ? <td colSpan="3" className="text-center text-slate-400 text-xs py-3">(請點擊試算以更新)</td> : (
                                                                <>
                                                                    <td className="px-4 py-3 text-center">
                                                                        <div className="text-[10px] text-red-400 mb-1 font-bold">+{params.inflationRate}%/年</div>
                                                                        <span className="inflation-badge">{result.inflationMultiplier.toFixed(2)}x</span>
                                                                    </td>
                                                                    <td className="px-4 py-3 text-right">
                                                                        <div className="text-slate-600 font-medium">{formatNumber(Math.round(computed.monthlyFuture * (item.type === 'flow' ? 1 : 0)) || Math.round(computed.futureValue))}</div>
                                                                        {item.type === 'flow' && <span className="text-[10px] text-red-400">/月</span>}
                                                                    </td>
                                                                    <td className="px-4 py-3 text-right font-bold text-slate-800">
                                                                        {formatNumber(Math.round(computed.requiredCapital))}
                                                                    </td>
                                                                </>
                                                            )}
                                                            <td className="px-4 py-3">
                                                                {!item.isInsuranceItem && <button onClick={() => deleteItem(item.id)} className="text-gray-300 hover:text-red-500 transition"><i className="fas fa-times"></i></button>}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* REORDERED: 2. Dashboard Summary */}
                                <div className="glass-card rounded-2xl p-6 bg-white shadow-lg border-t-4 border-slate-700 relative">
                                    {isDirty && (
                                        <div className="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                                            <div className="bg-black/70 text-white px-6 py-3 rounded-full backdrop-blur-sm font-bold shadow-2xl animate-bounce">
                                                <i className="fas fa-arrow-left mr-2"></i> 設定已變更，請點擊更新
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div className="flex flex-col md:flex-row justify-between items-start mb-6">
                                        <div>
                                            <h2 className="text-xl font-bold text-slate-800">退休資金缺口分析</h2>
                                            <span className="text-xs text-gray-400">基準：{params.retireAge}歲 至 {params.lifeExpectancy}歲 (共{result.yearsInRetirement}年)</span>
                                        </div>
                                        <div className="text-right">
                                             <div className={`text-3xl font-extrabold ${result.finalShortfall <= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                {formatCurrency(Math.max(0, result.finalShortfall))}
                                            </div>
                                            <div className="text-xs text-slate-400">{result.finalShortfall <= 0 ? '資金充裕' : '最終缺口 (退休時現值)'}</div>
                                            
                                            {result.finalShortfall > 0 && (
                                                <div className="text-[10px] text-red-400 mt-1 bg-red-50 px-2 py-1 rounded border border-red-100">
                                                    ⚠️ 相當於 85歲時 累積負債 {formatCurrency(result.shortfallFV)} (含複利)
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    
                                    {/* Waterfall Bars */}
                                    <div className="space-y-4 mb-8">
                                        <div className="flex items-center group text-sm">
                                            <div className="w-20 text-slate-500 font-medium">總需求</div>
                                            <div className="flex-1 mx-2">
                                                <div className="bg-slate-200 h-2 rounded-full overflow-hidden"><div className="bg-slate-600 h-full" style={{width: '100%'}}></div></div>
                                            </div>
                                            <div className="w-24 text-right font-bold text-slate-700">{formatCurrency(result.grossNeed)}</div>
                                        </div>
                                         <div className="flex items-center group text-sm">
                                            <div className="w-20 text-purple-500 font-medium">政府退休</div>
                                            <div className="flex-1 mx-2">
                                                <div className="bg-purple-100 h-2 rounded-full overflow-hidden"><div className="bg-purple-500 h-full" style={{width: `${Math.min(100, (result.govDeductions / result.grossNeed) * 100)}%`}}></div></div>
                                            </div>
                                            <div className="w-24 text-right font-bold text-purple-600">{formatCurrency(result.govDeductions)}</div>
                                        </div>
                                        <div className="flex items-center group text-sm">
                                            <div className="w-20 text-blue-500 font-medium">現在投資</div>
                                            <div className="flex-1 mx-2">
                                                <div className="bg-blue-100 h-2 rounded-full overflow-hidden"><div className="bg-blue-500 h-full" style={{width: `${Math.min(100, (result.investmentFV / result.grossNeed) * 100)}%`}}></div></div>
                                            </div>
                                            <div className="w-24 text-right font-bold text-blue-600">{formatCurrency(result.investmentFV)}</div>
                                        </div>
                                    </div>

                                    {/* Investment Suggestion */}
                                    {result.finalShortfall > 0 && (
                                        <div className="mb-8 bg-blue-50 border border-blue-100 rounded-xl p-4 flex items-center gap-4 animate-fade-in">
                                            <div className="bg-blue-100 p-3 rounded-full text-blue-600 text-xl">
                                                <i className="fas fa-lightbulb"></i>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-blue-800 text-sm">如何填補缺口？</h4>
                                                <div className="text-sm text-blue-700 mt-1">
                                                    1. 建議您從現在開始，每月需<span className="font-bold text-red-500">額外</span>定期定額投資 
                                                    <span className="text-xl font-extrabold mx-1 text-blue-900">{formatCurrency(result.suggestedMonthlySave)}</span>
                                                    <span className="text-xs text-slate-500">(不含目前已設定的 {formatCurrency(params.currentMonthlyInvestment)})</span>。
                                                </div>
                                                <div className="text-sm text-blue-700 mt-1">
                                                    2. 加總後，您每月<span className="font-bold">總共</span>需要投入 
                                                    <span className="text-xl font-extrabold mx-1 text-emerald-600">{formatCurrency(result.totalMonthlySave)}</span>
                                                    才能在退休時完全補足缺口。
                                                </div>
                                                <div className="text-[10px] text-blue-400 mt-2">
                                                    (假設年報酬 {params.preRetireRoiRate}%)
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Chart Section */}
                                    <div className="border-t border-gray-100 pt-6">
                                        <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                                            <i className="fas fa-chart-area text-orange-500"></i> 資金流向模擬圖 (資產消耗)
                                        </h3>
                                        <CashFlowChart 
                                            chartData={result.chartData} 
                                            retireAge={params.retireAge} 
                                            lifeExpectancy={params.lifeExpectancy} 
                                        />
                                        <div className="mt-2 bg-orange-50 p-3 rounded text-xs text-orange-800 leading-relaxed">
                                            <i className="fas fa-info-circle mr-1"></i>
                                            <strong>圖表解讀：</strong> <span className="text-orange-600 font-bold">橘線</span>為您目前的資產預估路徑。若橘線在85歲前觸及零軸，即代表資金用罄。
                                        </div>
                                    </div>
                                </div>

                                {/* REORDERED: 3. Timeline Table (Last) */}
                                <div className="glass-card rounded-2xl overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                                        <h3 className="font-semibold text-slate-700 flex items-center gap-2">
                                            <IconTable /> 全生涯現金流明細表
                                        </h3>
                                        <button onClick={downloadCSV} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm flex items-center gap-2 transition">
                                            <IconDownload /> 下載 CSV 報表
                                        </button>
                                    </div>
                                    <div className="overflow-x-auto max-h-96">
                                        <table className="w-full text-left cashflow-table">
                                            <thead className="sticky top-0 z-10 shadow-sm">
                                                <tr>
                                                    <th>年齡</th>
                                                    <th>階段</th>
                                                    <th className="text-right">資產結餘 (期末)</th>
                                                    <th className="text-right">當年度支出</th>
                                                    <th className="text-right">狀態</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {result.timelineData.map((row) => (
                                                    <tr key={row.age} className={row.gap < 0 ? 'bg-red-50' : ''}>
                                                        <td className="font-bold text-slate-600">{row.age}</td>
                                                        <td>
                                                            <span className={`text-xs px-2 py-1 rounded-full ${row.type === '累積期' ? 'bg-blue-100 text-blue-600' : row.type === '退休期' ? 'bg-orange-100 text-orange-600' : 'bg-gray-100 text-gray-600'}`}>
                                                                {row.type}
                                                            </span>
                                                        </td>
                                                        <td className="text-right font-mono">{formatNumber(Math.round(row.assets))}</td>
                                                        <td className="text-right font-mono text-slate-500">{row.needs > 0 ? formatNumber(Math.round(row.needs)) : '-'}</td>
                                                        <td className={`text-right font-bold font-mono ${row.gap < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
                                                            {row.gap < 0 ? '缺口' : '盈餘'}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
