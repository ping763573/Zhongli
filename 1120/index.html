<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商業保險全攻略 v2.5 (2025新制版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #10b981; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #059669; 
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .badge-new {
            background-color: #ef4444;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const VERSION = "2.5.0 (2025新制版)";

        // --- Icons ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Shield = (props) => <IconWrapper {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></IconWrapper>;
        const Maximize = (props) => <IconWrapper {...props}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" /></IconWrapper>;
        const Minimize = (props) => <IconWrapper {...props}><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" /></IconWrapper>;
        const AlertTriangle = (props) => <IconWrapper {...props}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></IconWrapper>;
        const HeartPulse = (props) => <IconWrapper {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3H19" /></IconWrapper>;
        const Umbrella = (props) => <IconWrapper {...props}><path d="M23 12a11.05 11.05 0 0 0-22 0zm-5 7a3 3 0 0 1-6 0v-7" /></IconWrapper>;
        const Users = (props) => <IconWrapper {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></IconWrapper>;
        const FileText = (props) => <IconWrapper {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><line x1="10" y1="9" x2="8" y2="9" /></IconWrapper>;
        const CheckCircle = (props) => <IconWrapper {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></IconWrapper>;
        const Car = (props) => <IconWrapper {...props}><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2" /><circle cx="6.5" cy="16.5" r="2.5" /><circle cx="16.5" cy="16.5" r="2.5" /></IconWrapper>;
        const Activity = (props) => <IconWrapper {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></IconWrapper>;
        const Home = (props) => <IconWrapper {...props}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconWrapper>;
        const Plane = (props) => <IconWrapper {...props}><path d="M2 12h5l5-8h4l-2 8h6l1-3h3l-3 6-3 6h-3l1-3H7l-2 8H2l3-8-3-8z" /></IconWrapper>;
        const BookOpen = (props) => <IconWrapper {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></IconWrapper>;
        const Scale = (props) => <IconWrapper {...props}><path d="M18 6h-5l-2 2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z" /><path d="M12 10l4 4" /><path d="M16 10l-4 4" /></IconWrapper>; // Simplified as file icon substitute
        const Info = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></IconWrapper>;

        // --- Components ---

        const Header = ({ isFullScreen, toggleFullScreen }) => (
            <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-emerald-100">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                        <div className="bg-emerald-600 p-2 rounded-lg text-white">
                            <Shield size={24} />
                        </div>
                        <div>
                            <h1 className="text-xl font-bold text-slate-800 tracking-wide">商業保險全攻略</h1>
                            <p className="text-xs text-emerald-600 font-medium">實務整合版 | {VERSION}</p>
                        </div>
                    </div>
                    <button onClick={toggleFullScreen} className="p-2 rounded-full hover:bg-emerald-50 text-emerald-700 transition-colors flex items-center gap-2 text-sm font-medium">
                        {isFullScreen ? <Minimize size={20} /> : <Maximize size={20} />}
                        <span className="hidden sm:inline">{isFullScreen ? '退出全螢幕' : '全螢幕模式'}</span>
                    </button>
                </div>
            </header>
        );

        const RiskControl = () => {
            const risks = [
                { title: "迴避 (Avoidance)", icon: <AlertTriangle size={32} />, desc: "不出門就不會被傳染", example: "徹底避開風險源頭", color: "bg-red-50 text-red-600 border-red-200" },
                { title: "抑制 (Reduction)", icon: <HeartPulse size={32} />, desc: "擔心會確診，先把身體養好", example: "降低發生機率或損害程度", color: "bg-orange-50 text-orange-600 border-orange-200" },
                { title: "移轉 (Transfer)", icon: <Umbrella size={32} />, desc: "買防疫險，作為替代性收入", example: "透過保險將風險轉嫁", color: "bg-emerald-50 text-emerald-600 border-emerald-200", highlight: true },
                { title: "自留 (Retention)", icon: <Users size={32} />, desc: "不擔心健康也不擔心經濟", example: "自行承擔損失", color: "bg-blue-50 text-blue-600 border-blue-200" },
            ];

            return (
                <section className="py-10 px-4 max-w-7xl mx-auto">
                    <div className="mb-6 border-l-4 border-emerald-500 pl-4">
                        <h2 className="text-2xl font-bold text-slate-800">風險控制的四種方式</h2>
                        <p className="text-slate-500 mt-1">以新冠肺炎為例，理解我們如何面對風險</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {risks.map((risk, idx) => (
                            <div key={idx} className={`p-6 rounded-xl border ${risk.color} card-hover relative overflow-hidden`}>
                                {risk.highlight && <div className="absolute top-0 right-0 bg-emerald-500 text-white text-xs px-2 py-1 rounded-bl-lg">保險核心</div>}
                                <div className="mb-4">{risk.icon}</div>
                                <h3 className="text-lg font-bold mb-2">{risk.title}</h3>
                                <p className="text-sm font-medium mb-2">{risk.desc}</p>
                                <p className="text-xs opacity-75">{risk.example}</p>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const Parties = () => {
            const [showAdvanced, setShowAdvanced] = useState(false);

            return (
                <section className="py-10 px-4 max-w-7xl mx-auto">
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="p-8 md:p-10 text-center">
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">保單關係人</h2>
                            <p className="text-slate-500 mb-10">一張保單中四個重要的角色與其權利義務</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-center relative mb-8">
                                <div className="hidden md:block absolute top-1/2 left-0 w-full h-1 bg-emerald-100 -z-10 transform -translate-y-1/2"></div>
                                {[{n:1, t:"保險人", d:"即保險公司", c:"emerald"}, {n:2, t:"要保人", d:"保單持有人\n(繳費/變更權)", c:"blue"}, {n:3, t:"被保險人", d:"保險標的\n(不可隨意變更)", c:"orange"}, {n:4, t:"受益人", d:"領取保險金之人\n(身故可變更)", c:"purple"}].map((item, idx) => (
                                    <div key={idx} className="bg-white p-6 rounded-xl border-2 border-slate-100 shadow-sm z-10 hover:border-emerald-200 transition-colors">
                                        <div className={`w-12 h-12 mx-auto bg-${item.c}-100 rounded-full flex items-center justify-center text-${item.c}-600 mb-3 font-bold`}>{item.n}</div>
                                        <h3 className="font-bold text-lg text-slate-700">{item.t}</h3>
                                        <p className="text-sm text-slate-500 whitespace-pre-line">{item.d}</p>
                                    </div>
                                ))}
                            </div>

                            <button 
                                onClick={() => setShowAdvanced(!showAdvanced)}
                                className="inline-flex items-center text-emerald-600 hover:text-emerald-700 font-medium text-sm"
                            >
                                <BookOpen size={16} className="mr-2" />
                                {showAdvanced ? "隱藏進階觀念" : "查看進階觀念 (保險利益/受益人)"}
                            </button>
                        </div>

                        {showAdvanced && (
                            <div className="bg-slate-50 border-t border-slate-200 p-8 animate-fade-in">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div>
                                        <h3 className="font-bold text-slate-800 mb-3 flex items-center"><CheckCircle size={18} className="text-emerald-500 mr-2"/> 保險利益 (Insurance Interest)</h3>
                                        <p className="text-sm text-slate-600 mb-2">要保人與被保險人之間必須存在特定關係，才能投保：</p>
                                        <ul className="list-disc list-inside text-sm text-slate-600 space-y-1 ml-2">
                                            <li>本人或其家屬</li>
                                            <li>生活費或教育費仰給之人</li>
                                            <li>債務人</li>
                                            <li>為本人管理財產或利益之人</li>
                                        </ul>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-slate-800 mb-3 flex items-center"><Users size={18} className="text-purple-500 mr-2"/> 受益人指定</h3>
                                        <p className="text-sm text-slate-600 mb-2"><strong>指定方式：</strong>可採順位或比例，亦可混合使用。</p>
                                        <div className="text-sm text-slate-600 bg-white p-3 rounded border border-slate-200">
                                            <p className="mb-1"><strong>⚠️ 注意：</strong></p>
                                            <ul className="list-disc list-inside space-y-1">
                                                <li>死亡給付受益人可變更。</li>
                                                <li>健康險、傷害險(無身故)之唯一受益人通常為<strong>被保險人本人</strong>。</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const InsuranceTabs = () => {
            const [activeTab, setActiveTab] = useState('regulations');

            const tabs = [
                { id: 'regulations', label: '2025 新制與爭議', icon: <Info size={18} /> },
                { id: 'personal', label: '人身保險', icon: <Activity size={18} /> },
                { id: 'auto', label: '車險與酒駕', icon: <Car size={18} /> },
                { id: 'earthquake', label: '地震險', icon: <Home size={18} /> },
                { id: 'travel', label: '旅遊保險', icon: <Plane size={18} /> },
                { id: 'ltc', label: '長照失能', icon: <Users size={18} /> },
            ];

            return (
                <section className="py-10 px-4 max-w-7xl mx-auto">
                    <h2 className="text-2xl font-bold text-slate-800 mb-6">商業保險種類與新制詳解</h2>
                    
                    {/* Tabs Navigation */}
                    <div className="flex space-x-2 overflow-x-auto pb-2 mb-6 no-scrollbar">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex items-center space-x-2 px-5 py-3 rounded-full font-medium transition-all whitespace-nowrap ${
                                    activeTab === tab.id 
                                    ? "bg-emerald-600 text-white shadow-lg scale-105" 
                                    : "bg-white text-slate-600 hover:bg-emerald-50"
                                }`}
                            >
                                {tab.icon}
                                <span>{tab.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Tab Content Area */}
                    <div className="bg-white rounded-2xl shadow-md border border-slate-100 min-h-[400px] animate-fade-in">
                        
                        {/* 0. 2025 新制與爭議 (New Tab) */}
                        {activeTab === 'regulations' && (
                            <div className="p-6 md:p-8">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="space-y-6">
                                        <h3 className="text-xl font-bold text-slate-800 border-l-4 border-red-500 pl-3">2024-2025 重大變革</h3>
                                        
                                        {/* Reform 1 */}
                                        <div className="bg-red-50 p-5 rounded-xl border border-red-100">
                                            <div className="flex justify-between items-start mb-2">
                                                <h4 className="font-bold text-red-700 text-lg">1. 實支實付醫療險改革</h4>
                                                <span className="bg-red-600 text-white text-xs px-2 py-1 rounded">目前已實施</span>
                                            </div>
                                            <p className="text-sm text-slate-700 mb-2"><strong>核心：</strong>落實「損害填補原則」。</p>
                                            <ul className="list-disc list-inside text-sm text-slate-600 space-y-1">
                                                <li><strong>正本理賠：</strong>所有新投保的實支實付醫療險，僅接受醫療收據正本。</li>
                                                <li><strong>取消副本：</strong>無法再透過「副本理賠」投保多張來獲得超過實際支出的理賠金。</li>
                                                <li><strong>配套：</strong>若額度不足，可購買「自負額」保單來補強。</li>
                                            </ul>
                                            <p className="text-xs text-red-500 mt-2">* 舊保單(保證續保者)權益暫不受影響。</p>
                                        </div>

                                        {/* Reform 2 */}
                                        <div className="bg-blue-50 p-5 rounded-xl border border-blue-100">
                                            <div className="flex justify-between items-start mb-2">
                                                <h4 className="font-bold text-blue-700 text-lg">2. 癌症 NGS 基因檢測</h4>
                                                <span className="bg-blue-600 text-white text-xs px-2 py-1 rounded">健保新制</span>
                                            </div>
                                            <p className="text-sm text-slate-700 mb-2"><strong>變化：</strong>次世代基因定序(NGS)納入健保給付。</p>
                                            <ul className="list-disc list-inside text-sm text-slate-600 space-y-1">
                                                <li><strong>限制：</strong>每人每種癌別終身限給付 1 次。</li>
                                                <li><strong>缺口：</strong>健保採定額給付(最高約3萬點)，但完整檢測費用常高達 5~10 萬元以上。</li>
                                                <li><strong>商保機會：</strong>新式癌症險或重大傷病險可補足此自費缺口。</li>
                                            </ul>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <h3 className="text-xl font-bold text-slate-800 border-l-4 border-yellow-500 pl-3">常見理賠爭議與注意事項</h3>
                                        
                                        <div className="bg-white border border-slate-200 p-5 rounded-xl shadow-sm">
                                            <h4 className="font-bold text-slate-800 mb-2 flex items-center"><AlertTriangle size={18} className="text-yellow-500 mr-2"/> 1. 既往症 (Pre-existing Condition)</h4>
                                            <p className="text-sm text-slate-600">保險法第127條：投保時已在疾病情況中，保險人對該項疾病不負給付保險金責任。</p>
                                            <p className="text-xs text-slate-400 mt-1">常發生於：帶病投保、剛看過醫生就投保。</p>
                                        </div>

                                        <div className="bg-white border border-slate-200 p-5 rounded-xl shadow-sm">
                                            <h4 className="font-bold text-slate-800 mb-2 flex items-center"><AlertTriangle size={18} className="text-yellow-500 mr-2"/> 2. 違反告知義務</h4>
                                            <p className="text-sm text-slate-600">要保書上的健康告知事項(如近2個月就醫、近5年住院等)若未誠實勾選，保險公司在<strong>兩年內</strong>有權解除契約且不退費。</p>
                                        </div>

                                        <div className="bg-white border border-slate-200 p-5 rounded-xl shadow-sm">
                                            <h4 className="font-bold text-slate-800 mb-2 flex items-center"><AlertTriangle size={18} className="text-yellow-500 mr-2"/> 3. 手術定義爭議</h4>
                                            <p className="text-sm text-slate-600"><strong>門診手術 vs 住院手術：</strong>隨著醫療進步，許多手術不需住院。需注意保單是否理賠「門診手術」及其額度限制(如白內障手術)。</p>
                                            <p className="text-sm text-slate-600 mt-1"><strong>處置 vs 手術：</strong>部分保單不賠「處置」(如大腸息肉切除可能被視為處置而非手術)。</p>
                                        </div>
                                        
                                        <div className="p-4 bg-slate-100 rounded-lg text-sm text-slate-600">
                                            <p className="font-bold mb-1">申訴管道：</p>
                                            <p>若發生爭議，可向<strong>財團法人金融消費評議中心</strong>申請評議。</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 1. 人身保險 Content */}
                        {activeTab === 'personal' && (
                            <div className="p-6 md:p-8">
                                <div className="flex items-center mb-4">
                                    <h3 className="text-xl font-bold text-emerald-700">常見的六大人身保險</h3>
                                    <span className="ml-3 text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full">2025 更新</span>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {[
                                        { t: "壽險", cond: "完全失能或身故", use: "子女教育、孝養、房貸、喪葬費", type: "一次或分期給付" },
                                        { t: "重大傷(疾)病險", cond: "罹患條款所列之特定傷病", use: "涵蓋癌症、自體免疫疾病等300+項", type: "一次給付 (領卡即賠)" },
                                        { t: "失能扶助險", cond: "符合失能等級表(1-11級)", use: "生活不便補償", type: "依等級給付 (市面選擇變少)" },
                                        { t: "醫療險 (實支實付)", cond: "住院或手術", use: "醫療費用補償 (2024新制：正本理賠)", type: "限額內花多少賠多少" },
                                        { t: "意外險", cond: "非疾病+外來+突發", use: "意外傷害補償", type: "一次或分期給付" },
                                        { t: "防癌險", cond: "罹患癌症及治療", use: "補強健保NGS檢測、標靶藥物費用", type: "一次或按療程給付" }
                                    ].map((item, idx) => (
                                        <div key={idx} className="border border-slate-200 rounded-xl p-5 hover:border-emerald-400 transition-colors bg-white">
                                            <h4 className="font-bold text-lg text-slate-800 mb-2">{item.t}</h4>
                                            <div className="space-y-2 text-sm">
                                                <p><span className="text-slate-400 font-medium">條件：</span> {item.cond}</p>
                                                <p><span className="text-slate-400 font-medium">形式：</span> {item.type}</p>
                                                <p><span className="text-slate-400 font-medium">用途：</span> {item.use}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 2. 車險與酒駕 Content */}
                        {activeTab === 'auto' && (
                            <div className="p-6 md:p-8">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    {/* Left: Auto Insurance Types */}
                                    <div>
                                        <h3 className="text-xl font-bold text-blue-700 mb-4">汽車保險架構</h3>
                                        <div className="space-y-4">
                                            <div className="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-500">
                                                <h4 className="font-bold text-blue-800">強制險 (公辦民營)</h4>
                                                <ul className="text-sm text-blue-900 mt-2 space-y-1">
                                                    <li>• 死亡給付：200 萬/人</li>
                                                    <li>• 失能給付：最高 200 萬 (依15級)</li>
                                                    <li>• 傷害醫療：最高 20 萬</li>
                                                    <li className="text-xs text-red-600 font-bold mt-1">⚠️ 2025 費率：酒駕違規每次加費 3,600 元 (無上限)</li>
                                                </ul>
                                            </div>
                                            <div className="bg-slate-50 p-4 rounded-lg border-l-4 border-slate-400">
                                                <h4 className="font-bold text-slate-800">任意險 (補強強制險不足)</h4>
                                                <ul className="text-sm text-slate-600 mt-2 space-y-1">
                                                    <li><strong>駕駛人：</strong> 駕駛人傷害險 (自撞/單一事故)</li>
                                                    <li><strong>車體：</strong> 甲(不明原因)/乙(自撞)/丙(車碰車)</li>
                                                    <li><strong>第三人(對方)：</strong> 財損與體傷 (必備!)</li>
                                                    <li><strong>超額責任險：</strong> 補足第三人額度 (建議 1000 萬以上)</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Right: DUI Table */}
                                    <div>
                                        <h3 className="text-xl font-bold text-red-700 mb-4 flex items-center"><AlertTriangle size={20} className="mr-2"/>酒駕理賠規範 (2025)</h3>
                                        <div className="overflow-x-auto border border-slate-200 rounded-lg">
                                            <table className="w-full text-sm text-left">
                                                <thead className="bg-slate-100 text-slate-700">
                                                    <tr>
                                                        <th className="p-3 font-bold">酒精濃度</th>
                                                        <th className="p-3 font-bold">強制險(受害人)</th>
                                                        <th className="p-3 font-bold">任意險/車體險</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-200">
                                                    <tr>
                                                        <td className="p-3 font-medium text-emerald-600">&lt; 0.15 mg</td>
                                                        <td className="p-3">理賠</td>
                                                        <td className="p-3">理賠</td>
                                                    </tr>
                                                    <tr className="bg-yellow-50">
                                                        <td className="p-3 font-medium text-orange-600">0.15 ~ 0.25 mg</td>
                                                        <td className="p-3">理賠 (後代位求償)</td>
                                                        <td className="p-3 text-red-600 font-bold">不賠 / 除外</td>
                                                    </tr>
                                                    <tr className="bg-red-50">
                                                        <td className="p-3 font-medium text-red-600">&gt; 0.25 mg</td>
                                                        <td className="p-3">理賠 (後代位求償)</td>
                                                        <td className="p-3 text-red-600 font-bold">視為犯罪行為不賠</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div className="text-xs text-slate-500 mt-3 space-y-1 bg-slate-50 p-3 rounded">
                                            <p><strong>* 代位求償：</strong>強制險會先賠給受害人，再向酒駕之被保險人追討。</p>
                                            <p><strong>* 加費規定：</strong>前一年有酒駕紀錄，隔年強制險保費直接加 $3,600，兩次 $7,200，依此類推無上限。</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. 地震險 Content */}
                        {activeTab === 'earthquake' && (
                            <div className="p-6 md:p-8">
                                <h3 className="text-xl font-bold text-orange-700 mb-4">住宅地震險比較 (2025 保額維持)</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left border-collapse">
                                        <thead>
                                            <tr className="bg-orange-50 border-b-2 border-orange-200">
                                                <th className="p-3 whitespace-nowrap">項目</th>
                                                <th className="p-3 bg-orange-100">住宅地震基本險</th>
                                                <th className="p-3">超額地震險</th>
                                                <th className="p-3 bg-slate-50">擴大地震險</th>
                                                <th className="p-3">輕損地震險</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            <tr>
                                                <td className="p-3 font-bold text-slate-700">說明</td>
                                                <td className="p-3 bg-orange-50 font-bold text-orange-800">政策性保險 (房貸必保)</td>
                                                <td className="p-3">補強基本險不足</td>
                                                <td className="p-3 bg-slate-50">保障最完整</td>
                                                <td className="p-3">針對牆壁龜裂等</td>
                                            </tr>
                                            <tr>
                                                <td className="p-3 font-bold text-slate-700">保障額度</td>
                                                <td className="p-3 bg-orange-50">最高 150 萬 + 20萬(臨時住宿)</td>
                                                <td className="p-3">依需求約定 (如+200萬)</td>
                                                <td className="p-3 bg-slate-50">依重置成本</td>
                                                <td className="p-3">約 10~30 萬</td>
                                            </tr>
                                            <tr>
                                                <td className="p-3 font-bold text-slate-700">理賠條件</td>
                                                <td className="p-3 bg-orange-50 text-red-600">全損 / 不堪居住</td>
                                                <td className="p-3">同基本險 (全損)</td>
                                                <td className="p-3 bg-slate-50 text-emerald-600">不需全損 (含半倒/龜裂)</td>
                                                <td className="p-3">非全損可賠</td>
                                            </tr>
                                            <tr>
                                                <td className="p-3 font-bold text-slate-700">參考保費</td>
                                                <td className="p-3 bg-orange-50">單一費率 $1,350 元</td>
                                                <td className="p-3">約 $3,000 元</td>
                                                <td className="p-3 bg-slate-50">較高 (萬分之20以上)</td>
                                                <td className="p-3">約 $1,000+ 元</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 4. 旅遊險 Content */}
                        {activeTab === 'travel' && (
                            <div className="p-6 md:p-8">
                                <h3 className="text-xl font-bold text-teal-700 mb-4">旅遊綜合保險 (海外突發疾病/不便險)</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-teal-50 rounded-xl p-5 border border-teal-100">
                                        <h4 className="font-bold text-teal-800 mb-3 flex items-center"><Users size={18} className="mr-2"/> 旅遊平安險 (保障人)</h4>
                                        <ul className="space-y-2 text-sm text-slate-700">
                                            <li>• <strong>海外突發疾病：</strong>需注意是否包含「法定傳染病」(如COVID-19)。部分網投保單已排除。</li>
                                            <li>• <strong>緊急醫療運送：</strong>建議額度 5萬美金以上 (歐美需更高)。</li>
                                            <li>• <strong>不保事項：</strong>既往症 (出國前90/180天內曾就診之疾病通常不賠)。</li>
                                        </ul>
                                    </div>
                                    <div className="bg-slate-50 rounded-xl p-5 border border-slate-200">
                                        <h4 className="font-bold text-slate-800 mb-3 flex items-center"><Plane size={18} className="mr-2"/> 旅遊不便險 (保障行程)</h4>
                                        <ul className="space-y-2 text-sm text-slate-700">
                                            <li>• <strong>班機延誤 (Delay)：</strong>通常延誤 4小時以上理賠。</li>
                                            <li className="bg-white p-2 rounded border border-slate-200 text-xs">
                                                <strong>爭議點：</strong> 
                                                1. 出發延誤 vs 抵達延誤 (多數保單改為「出發」延誤)。<br/>
                                                2. 罷工：若投保前已發布罷工新聞，則屬「已發生事故」，不理賠。
                                            </li>
                                            <li>• <strong>行李延誤：</strong>抵達目的地6小時後未領到。 (回國時通常不賠行李延誤)。</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 5. 長照與失能 Content */}
                        {activeTab === 'ltc' && (
                            <div className="p-6 md:p-8">
                                <h3 className="text-xl font-bold text-indigo-700 mb-4">失能險 vs 長照險 (2025 市場概況)</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-indigo-50 p-5 rounded-xl">
                                        <h4 className="font-bold text-indigo-800 mb-2">失能險 (Disability)</h4>
                                        <p className="text-sm mb-2"><strong>定義：</strong>依「失能等級表」(1-11級) 認定。</p>
                                        <div className="text-sm text-indigo-900 bg-indigo-100 p-2 rounded mb-2">
                                            <strong>現況：</strong> 因理賠率過高，保險公司大量停售長年期保證給付商品。目前多為「一年期」或「不保證續保」商品。
                                        </div>
                                        <p className="text-xs opacity-75">適合：擔心工作能力喪失、需要薪資補償者。</p>
                                    </div>
                                    <div className="bg-slate-50 p-5 rounded-xl">
                                        <h4 className="font-bold text-slate-800 mb-2">長照險 (LTC)</h4>
                                        <p className="text-sm mb-2"><strong>定義：</strong>生理(巴氏量表)或認知(CDR)功能障礙。</p>
                                        <ul className="text-sm list-disc list-inside space-y-1 text-slate-600">
                                            <li><strong>生理：</strong>進食、移位、如廁、沐浴、平地行動、更衣 (6中3)。</li>
                                            <li><strong>認知：</strong>持續失智且無法分辨時間、場所、人物 (3中2)。</li>
                                        </ul>
                                        <p className="text-xs mt-2 text-slate-500">* 理賠門檻較高，需每年複檢。</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const PolicyCheck = () => {
            const [checked, setChecked] = useState({});
            const items = [
                "確認實支實付是否為「正本理賠」",
                "檢查癌症險是否含「NGS 基因檢測」",
                "車險強制險是否因酒駕被加費",
                "檢視受益人設定 (是否需調整)",
                "確認旅遊險是否含法定傳染病",
                "檢視失能險是否保證續保",
                "聯絡資料更新 (地址/電話)"
            ];
            const toggleCheck = (idx) => setChecked(prev => ({...prev, [idx]: !prev[idx]}));
            const progress = Math.round((Object.keys(checked).filter(k => checked[k]).length / items.length) * 100);

            return (
                <section className="py-10 px-4 max-w-7xl mx-auto mb-10">
                    <div className="bg-emerald-900 rounded-3xl overflow-hidden shadow-xl flex flex-col md:flex-row text-white">
                        <div className="p-8 md:w-1/3 bg-emerald-800 flex flex-col justify-center items-center text-center">
                            <FileText size={48} className="mb-4 opacity-80" />
                            <h2 className="text-2xl font-bold mb-2">保單健檢自己來</h2>
                            <p className="text-emerald-200 mb-6">2025 重點項目檢視</p>
                            <div className="w-full bg-emerald-900 rounded-full h-4 mb-2">
                                <div className="bg-emerald-400 h-4 rounded-full transition-all duration-500" style={{width: `${progress}%`}}></div>
                            </div>
                            <p className="text-sm font-mono">{progress}% 完成</p>
                        </div>
                        <div className="p-8 md:w-2/3">
                            <div className="grid grid-cols-1 gap-3">
                                {items.map((item, idx) => (
                                    <button key={idx} onClick={() => toggleCheck(idx)} className={`flex items-center p-3 rounded-lg transition-all text-left ${checked[idx] ? "bg-emerald-700/50 text-emerald-100 line-through decoration-emerald-400" : "bg-emerald-800 hover:bg-emerald-700 text-white"}`}>
                                        <div className={`w-6 h-6 rounded-full border-2 mr-3 flex items-center justify-center ${checked[idx] ? "border-emerald-400 bg-emerald-400" : "border-emerald-400"}`}>
                                            {checked[idx] && <CheckCircle size={16} className="text-emerald-900" />}
                                        </div>
                                        {item}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Main App
        const App = () => {
            const [isFullScreen, setIsFullScreen] = useState(false);
            const toggleFullScreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                    setIsFullScreen(true);
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                        setIsFullScreen(false);
                    }
                }
            };
            useEffect(() => {
                const handleChange = () => setIsFullScreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleChange);
                return () => document.removeEventListener('fullscreenchange', handleChange);
            }, []);

            return (
                <div className="min-h-screen flex flex-col text-slate-700">
                    <Header isFullScreen={isFullScreen} toggleFullScreen={toggleFullScreen} />
                    <main className="flex-grow">
                        <div className="bg-emerald-600 text-white py-12 px-4 text-center">
                            <h2 className="text-3xl md:text-4xl font-bold mb-4">2025 商業保險全攻略</h2>
                            <p className="text-emerald-100 text-lg max-w-2xl mx-auto">整合最新法規、實支實付改革與 NGS 基因檢測趨勢，打造與時俱進的防護網。</p>
                        </div>
                        <RiskControl />
                        <Parties />
                        <InsuranceTabs />
                        <PolicyCheck />
                    </main>
                    <footer className="bg-slate-800 text-slate-400 py-8 text-center text-sm">
                        <p>© 2025 中壢社區大學 | 講師：劉威澤</p>
                        <p className="mt-2 text-slate-500">資料來源：課程講義、保險局公告、金融消費評議中心</p>
                        <p className="mt-1 text-xs font-mono text-slate-600">Visualizer v{VERSION}</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
